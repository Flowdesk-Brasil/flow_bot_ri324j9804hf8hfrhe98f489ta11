# Catch-all for unknown *.flwdesk.com hosts on the customer VPS.
# Per-project vhosts are written by vps-daemon.js as flowdesk-<vpsCode>.conf

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /opt/flowdesk/error-pages;
    error_page 404 /404.html;
    error_page 500 /500.html;
    error_page 502 503 504 /502.html;
    location / {
        try_files $uri /404.html;
    }
}
